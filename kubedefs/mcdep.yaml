apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpromc-deployment
  labels:
    app: vpromc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpromc
  template:
    metadata:
      labels:
        app: vpromc
    spec:
      containers:
      - name: vpromc
        image: memcached:latest
        ports:
        - containerPort: 11211
          name: vpromc-port
